<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>腦力健康站</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=17">
</head>
<body>
  <div class="page-wrapper">
    <div class="bg-deco deco-1">🌸</div>
    <div class="bg-deco deco-2">🌿</div>
    <div class="bg-deco deco-3">🌼</div>
    <div class="bg-deco deco-4">🍃</div>

    <div class="hero-spacer"></div>

    <main class="main-content">
      <div class="game-cards-container">
        <a href="games/memory-match.html" class="game-card card-memory">
          <div class="card-top-bar"></div>
          <div class="card-emoji-big"><img class="card-icon-img" src="images/icons/memory-match.png" alt=""></div>
          <div class="card-content">
            <h2 class="card-title">廚房翻牌記憶力</h2>
            <div class="card-tags">
              <span class="tag">記憶力訓練</span>
            </div>
          </div>
          <div class="card-btn">開始遊戲 →</div>
        </a>

        <a href="games/daily-math.html" class="game-card card-math">
          <div class="card-top-bar"></div>
          <div class="card-emoji-big"><img class="card-icon-img" src="images/icons/daily-math.png" alt=""></div>
          <div class="card-content">
            <h2 class="card-title">作帳小幫手</h2>
            <div class="card-tags">
              <span class="tag">算術訓練</span>
            </div>
          </div>
          <div class="card-btn">開始遊戲 →</div>
        </a>

        <a href="games/taiyaki.html" class="game-card card-taiyaki">
          <div class="card-top-bar"></div>
          <div class="card-emoji-big"><img class="card-icon-img" src="images/icons/taiyaki.png" alt=""></div>
          <div class="card-content">
            <h2 class="card-title">埔里特產鯛魚燒</h2>
            <div class="card-tags">
              <span class="tag">空間對稱訓練</span>
            </div>
          </div>
          <div class="card-btn">開始遊戲 →</div>
        </a>

        <a href="games/find-bird.html" class="game-card card-bird">
          <div class="card-top-bar"></div>
          <div class="card-emoji-big"><img class="card-icon-img" src="images/icons/find-bird.png" alt=""></div>
          <div class="card-content">
            <h2 class="card-title">藍鳥在哪裡？</h2>
            <div class="card-tags">
              <span class="tag">視覺搜尋訓練</span>
            </div>
          </div>
          <div class="card-btn">開始遊戲 →</div>
        </a>
      </div>
    </main>
  </div>
</body>
</html>
