<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>廚房翻牌記憶力</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css?v=17">
  <style>
    /* ── Card Board ── */
    #game-board {
      display: grid;
      gap: clamp(4px, 1.2vh, 10px);
      width: 100%;
      flex: 1;           /* 填滿剩餘高度 */
      min-height: 0;
      align-content: center;  /* 牌組垂直置中 */
    }

    /* ── Card ── */
    .card {
      aspect-ratio: 3 / 4;
      background: transparent;
      perspective: 900px;
      cursor: pointer;
      border: none;
      padding: 0;
      min-width: 0;
    }
    .card:focus-visible { outline: 3px solid var(--c-primary); outline-offset: 3px; border-radius: var(--r-md); }
    .card.locked { pointer-events: none; }

    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform .52s cubic-bezier(.4,0,.2,1);
      border-radius: var(--r-md);
    }
    .card.flipped .card-inner,
    .card.matched .card-inner { transform: rotateY(180deg); }

    .card-face {
      position: absolute;
      inset: 0;
      border-radius: var(--r-md);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: var(--sh-md);
    }

    /* Back face */
    .card-back {
      background: linear-gradient(145deg, #FF9D5C 0%, #D9712E 100%);
      overflow: hidden;
    }
    .card-back-icon { font-size: clamp(20px, 8vw, 40px); opacity: .55; }
    .card-back-img { width: 100%; height: 100%; object-fit: cover; border-radius: inherit; }
    .card-back.has-img .card-back-icon { display: none; }

    /* Front face (hidden until flipped) */
    .card-front {
      background: #FFFBF6;
      transform: rotateY(180deg);
      padding: 6px 4px;
      gap: 3px;
    }
    .card-emoji { font-size: clamp(24px, 11vw, 64px); line-height: 1; }

    /* Matched state */
    .card.matched .card-front {
      background: linear-gradient(145deg, #E8F5E9, #C8E6C9);
    }
    .card.matched .card-inner { animation: bounce-in .35s ease; }

    /* Level badge */
    .level-badge {
      display: none;
      align-items: center;
      gap: 8px;
      background: var(--c-primary);
      color: white;
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 18px;
      font-weight: 700;
    }

    /* Progress dots */
    .level-dots { display:flex; gap:10px; justify-content:center; margin-top:2px; flex-shrink:0; }
    .level-dot  { width:10px; height:10px; border-radius:50%; background:var(--c-border); transition:background .3s; }
    .level-dot.done    { background:var(--c-green); }
    .level-dot.current { background:var(--c-primary); transform:scale(1.3); }
  </style>
</head>
<body>
  <div class="game-page">
    <div class="bg-deco deco-2">🥄</div>

    <!-- ── Start Screen ── -->
    <div id="start-screen" class="start-screen">
      <h1 class="start-title">廚房翻牌記憶力</h1>
      <p class="start-desc">
        翻開牌面，找到兩張相同的廚房用具！<br>
        共三關，難度逐漸增加。
      </p>
      <div class="start-rules">
        <h3>遊戲規則</h3>
        <ul>
          <li>點擊牌面找出兩張一樣的圖案</li>
          <li>共三關，牌數逐關增加（6→8→10 張）</li>
          <li>每關限時 <strong>60 秒</strong>，配對完成即過關</li>
        </ul>
      </div>
      <div class="start-btns">
        <div class="diff-options">
          <button class="diff-btn diff-easy" id="btn-easy">
            <span class="diff-name">簡單</span>
            <span class="diff-hint">90秒<br>3→4→5 對</span>
          </button>
          <button class="diff-btn diff-normal" id="btn-normal">
            <span class="diff-name">普通</span>
            <span class="diff-hint">60秒<br>3→4→5 對</span>
          </button>
          <button class="diff-btn diff-hard" id="btn-hard">
            <span class="diff-name">困難</span>
            <span class="diff-hint">40秒<br>4→5→6 對</span>
          </button>
        </div>
        <button class="btn btn-outline" onclick="location.href='../index.html'">← 回主選單</button>
      </div>
    </div>

    <!-- ── Game Screen ── -->
    <div id="game-screen" class="game-screen hidden">
      <div class="game-header">
        <button class="back-btn" onclick="location.href='../index.html'">← 返回</button>
        <div class="game-title-bar">
          <div class="game-name">廚房翻牌記憶力</div>
          <div style="display:flex;justify-content:center;gap:8px;margin-top:6px;flex-wrap:wrap">
            <span class="level-badge" id="level-label">第一關</span>
            <span class="diff-badge" id="diff-badge">普通</span>
          </div>
        </div>
      </div>

      <div class="stats-row">
        <div class="stat-box">
          <span class="stat-label">⏱ 剩餘時間</span>
          <span class="stat-value" id="timer-value">60</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">✅ 配對進度</span>
          <span class="stat-value"><span id="match-count">0</span>/<span id="total-count">3</span></span>
        </div>
      </div>

      <div class="level-dots">
        <div class="level-dot current" id="dot-1"></div>
        <div class="level-dot" id="dot-2"></div>
        <div class="level-dot" id="dot-3"></div>
      </div>

      <div id="game-board" role="grid" aria-label="翻牌記憶遊戲板"></div>
    </div>

    <!-- ── Result Screen ── -->
    <div id="result-screen" class="result-screen hidden">
      <div class="result-card">
        <p class="result-outcome" id="result-outcome">🏆 全部完成！</p>
        <div class="result-stars">
          <span class="result-star" id="star-1">⭐</span>
          <span class="result-star" id="star-2">⭐</span>
          <span class="result-star" id="star-3">⭐</span>
        </div>
        <div class="result-score-wrap">
          <span class="result-score" id="result-score">0</span>
          <span class="result-score-max">/ 1000 分</span>
        </div>
        <div class="result-breakdown">
          <p class="breakdown-title">分數明細</p>
          <div class="breakdown-row">
            <span class="breakdown-label">✅ 完成分</span>
            <span class="breakdown-pts" id="bd-completion">0 分</span>
          </div>
          <div class="breakdown-row">
            <span class="breakdown-label">⚡ 速度分</span>
            <span class="breakdown-pts" id="bd-speed">0 分</span>
          </div>
          <div class="breakdown-row">
            <span class="breakdown-label">🎯 難度加成</span>
            <span class="breakdown-pts" id="bd-difficulty">0 分</span>
          </div>
        </div>
        <div class="result-btns">
          <button class="btn btn-primary btn-lg" id="result-retry">🔁 再玩一次</button>
          <button class="btn btn-outline" id="result-home">回主選單</button>
        </div>
      </div>
      <p class="result-encourage" id="result-encourage"></p>
    </div>

    <!-- ── Dialog ── -->
    <div id="dialog-overlay" class="dialog-overlay hidden" role="dialog" aria-modal="true">
      <div class="dialog-box">
        <div class="dialog-emoji" id="dialog-emoji">🎉</div>
        <h2 class="dialog-title" id="dialog-title">標題</h2>
        <p class="dialog-msg" id="dialog-msg">訊息</p>
        <div class="dialog-btns" id="dialog-btns"></div>
      </div>
    </div>
  </div>

  <script src="../js/memory-match.js?v=5"></script>
</body>
</html>
