<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>銀髮族健康問答</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/quiz.css">
</head>
<body>
    <header>
        <h1>健康知識問答</h1>
        <a href="/" class="back-home-btn">← 返回食譜</a>
    </header>

    <main class="quiz-container">

        <!-- 開始畫面 -->
        <div id="start-screen" class="quiz-screen">
            <h2>歡迎來到健康知識小教室</h2>
            <p class="quiz-subtitle">每天 5 題,輕鬆學習銀髮族健康小知識!</p>
            <p class="quiz-info" id="total-info">準備中...</p>
            <button class="quiz-big-btn" onclick="startQuiz()">開始作答</button>
        </div>

        <!-- 作答畫面 -->
        <div id="quiz-screen" class="quiz-screen" style="display: none;">
            <div class="quiz-progress">
                <span id="progress-text">第 1 題 / 共 5 題</span>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
            </div>

            <div class="quiz-card">
                <div class="quiz-question-no" id="question-no">題號 33</div>
                <h2 class="quiz-question" id="question-text">題目載入中...</h2>

                <div class="quiz-options">
                    <button class="quiz-option-btn" id="btn-a" onclick="submitAnswer('A')">
                        <span class="option-label">A</span>
                        <span class="option-text" id="option-a-text">選項 A</span>
                    </button>
                    <button class="quiz-option-btn" id="btn-b" onclick="submitAnswer('B')">
                        <span class="option-label">B</span>
                        <span class="option-text" id="option-b-text">選項 B</span>
                    </button>
                </div>
            </div>

            <!-- 答案回饋區(預設隱藏) -->
            <div id="feedback-area" class="feedback-area" style="display: none;">
                <div id="feedback-result" class="feedback-result"></div>
                <div class="feedback-explanation">
                    <div class="feedback-title">📖 解釋說明</div>
                    <p id="feedback-explanation-text"></p>
                </div>
                <button class="quiz-big-btn" id="next-btn" onclick="nextQuestion()">下一題</button>
            </div>
        </div>

        <!-- 結算畫面 -->
        <div id="result-screen" class="quiz-screen" style="display: none;">
            <h2>作答完成 🎉</h2>
            <div class="final-score">
                <div class="score-number"><span id="score-correct">0</span> / <span id="score-total">0</span></div>
                <div class="score-text" id="score-text">答對題數</div>
            </div>
            <p class="quiz-subtitle" id="score-comment">繼續學習,身體更健康!</p>
            <button class="quiz-big-btn" onclick="restartQuiz()">再玩一次</button>
            <a href="/" class="quiz-secondary-btn">返回食譜首頁</a>
        </div>

    </main>

    <script src="/static/quiz.js"></script>
</body>
</html>
