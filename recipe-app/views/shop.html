<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>商店</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/shop.css">
</head>
<body>
    <header>
        <h1>商店</h1>
        <div class="money-bar">
            💰 <span id="money-amount">--</span>
        </div>
        <a href="/" class="back-home-btn">← 返回首頁</a>
    </header>

    <main class="shop-container">
        <div id="uid-bar" class="uid-bar" style="display:none;">
            <label>玩家 user_id:</label>
            <input type="number" id="uid-input" min="1" placeholder="輸入 user_id 測試">
            <button onclick="setUserId()">套用</button>
        </div>

        <section>
            <h2>商品清單</h2>
            <div id="items-grid" class="items-grid">
                <p class="hint">商品載入中...</p>
            </div>
        </section>

        <section>
            <h2>我的庫存</h2>
            <div id="inventory-grid" class="items-grid">
                <p class="hint">尚未擁有任何商品</p>
            </div>
        </section>
    </main>

    <div id="toast" class="toast"></div>

    <script src="/static/shop.js"></script>
</body>
</html>
